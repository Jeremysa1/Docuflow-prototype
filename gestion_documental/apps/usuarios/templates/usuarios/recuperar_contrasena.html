{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña - SIGEA</title>
    <link rel="stylesheet" href="{% static 'css/ui-ux-pro.css' %}">
    <!-- Importar fuente de Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    
</head>
<body class="auth-recover-body">

    <div class="login-card">
        <!-- Ícono superior -->
        <div class="icon-container">
            <svg viewBox="0 0 24 24" fill="none" stroke="#142a59" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">
                <!-- Flecha de rotación -->
                <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8" />
                <path d="M16 8h5V3" />
                
                <!-- Candado interno -->
                <rect x="8" y="11" width="8" height="6" rx="1.5" fill="#142a59" stroke="none" />
                <path d="M10 11V9a2 2 0 1 1 4 0v2" />
            </svg>
        </div>

        <!-- Textos -->
        <h1>¿Olvidó su Contraseña?</h1>
        <p class="subtitle">Puedes recuperar tu contraseña de SIGEA aquí</p>

        <!-- Mensajes de Django -->
        {% if messages %}
            {% for message in messages %}
                <div class="alert {% if message.tags == 'error' %}alert-error{% else %}alert-success{% endif %}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <!-- Formulario -->
        <form action="{% url 'auth:recuperar_contrasena' %}" method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label>CORREO INSTITUCIONAL</label>
                <div class="input-wrapper">
                    <!-- Ícono de sobre (email) -->
                    <svg viewBox="0 0 24 24">
                        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                        <polyline points="22,6 12,13 2,6"></polyline>
                    </svg>
                    <input type="email" name="email" placeholder="usuario@institucion.edu" required autofocus>
                </div>
            </div>

            <button type="submit" class="btn-submit">
                Recuperar Contraseña
                <!-- Ícono de flecha derecha -->
                <svg viewBox="0 0 24 24">
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                    <polyline points="12 5 19 12 12 19"></polyline>
                </svg>
            </button>
        </form>

        <!-- Enlace Volver -->
        <a href="{% url 'auth:login' %}" class="back-link">
            <!-- Ícono de flecha izquierda -->
            <svg viewBox="0 0 24 24">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
            Volver al inicio de sesión
        </a>
    </div>

</body>
</html>
