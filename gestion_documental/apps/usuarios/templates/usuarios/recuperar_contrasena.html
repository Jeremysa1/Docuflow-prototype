{% extends "usuarios/_acceso.html" %}
{% load sigea %}
{% block title %}Recuperar contraseña{% endblock %}
{% block caja %}
<header>
  <h1>Recupera tu contraseña</h1>
  <p>Escribe tu correo y te enviaremos un código de 6 dígitos.</p>
</header>
<form method="post" class="sg-form">
  {% csrf_token %}
  <div class="sg-campo"><label for="email">Correo</label><input id="email" name="email" type="email" autocomplete="email" required></div>
  <button type="submit" class="sg-btn sg-btn--marca sg-btn--bloque">Continuar</button>
</form>
<div class="sg-acceso__enlaces"><a href="{% url 'auth:login' %}">Volver a iniciar sesión</a></div>
{% endblock %}
