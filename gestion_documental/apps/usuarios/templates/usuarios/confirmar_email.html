{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmar Datos - SIGEA</title>
    <!-- Importar fuente de Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* Reseteo básico y tipografía */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        /* Fondo de la pantalla y contenedor principal */
        body {
            background-color: #f4f7fc; /* Alineado con login */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Título de la marca fuera de la tarjeta */
        .brand-title {
            color: #1e3a63; /* Navy consistente */
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 25px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        /* Contenedor principal (La Tarjeta) */
        .login-card {
            background-color: #ffffff;
            width: 100%;
            max-width: 480px; /* Un poco más ancha que el login */
            padding: 40px 40px 30px 40px;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.05);
            border-top: 4px solid #1e3a63; /* Línea superior navy */
            text-align: center;
        }

        /* Ícono superior circular */
        .icon-container {
            background-color: #eef2fb;
            width: 55px;
            height: 55px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 20px auto;
        }

        .icon-container svg {
            width: 26px;
            height: 26px;
        }

        /* Textos de cabecera */
        h1 {
            color: #1a202c;
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 12px;
            line-height: 1.3;
        }

        .subtitle {
            color: #718096;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 30px;
            padding: 0 10px;
        }

        /* Caja de selección (Radio button falso) */
        .selection-box {
            background-color: #eff3fa; /* Gris/azul muy claro */
            border-radius: 8px;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            margin-bottom: 35px;
            transition: background-color 0.2s;
            cursor: pointer;
            border: 1px solid transparent;
        }

        .selection-box:hover {
            background-color: #e2e8f0;
        }

        /* Ícono dentro de la caja de selección */
        .selection-icon {
            background-color: #ffffff;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-right: 15px;
            flex-shrink: 0;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .selection-icon svg {
            width: 18px;
            height: 18px;
            stroke: #4a5568;
        }

        /* Textos dentro de la caja de selección */
        .selection-text {
            text-align: left;
            flex-grow: 1;
        }

        .selection-label {
            display: block;
            font-size: 12px;
            color: #718096;
            margin-bottom: 2px;
            font-weight: 500;
        }

        .selection-value {
            display: block;
            font-size: 14px;
            color: #1e3a63;
            font-weight: 600;
            font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; /* Fuente monoespaciada para el correo */
            letter-spacing: 0.5px;
        }

        /* Check final de la caja */
        .selection-check {
            flex-shrink: 0;
            margin-left: 10px;
        }

        .selection-check svg {
            width: 22px;
            height: 22px;
            fill: #1e3a63;
        }

        /* Botón de enviar */
        .btn-submit {
            background-color: #1e3a63;
            color: #ffffff;
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            transition: background-color 0.3s;
        }

        .btn-submit:hover {
            background-color: #152b4a;
        }

        .btn-submit svg {
            width: 16px;
            height: 16px;
            fill: none;
            stroke: #ffffff;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* Enlace de cancelar */
        .cancel-link {
            display: inline-block;
            margin-top: 25px;
            color: #718096;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: color 0.3s;
        }

        .cancel-link:hover {
            color: #1e3a63;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <!-- Texto de marca superior -->
    <div class="brand-title">SIGEA</div>

    <div class="login-card">
        <!-- Ícono superior principal (Sobre con check) -->
        <div class="icon-container">
            <svg viewBox="0 0 24 24" fill="#1e3a63" xmlns="http://www.w3.org/2000/svg">
                <path d="M20 4H4C2.9 4 2.01 4.9 2.01 6L2 18C2 19.1 2.9 20 4 20H20C21.1 20 22 19.1 22 18V6C22 4.9 21.1 4 20 4ZM20 8L12 13L4 8V6L12 11L20 6V8Z"/>
                <!-- Pequeño check superpuesto -->
                <path d="M16 10L11 15L8 12L9.4 10.6L11 12.2L14.6 8.6L16 10Z" fill="#ffffff" />
            </svg>
        </div>

        <!-- Textos principales -->
        <h1>Confirme los datos registrados en<br>SIGEA</h1>
        <p class="subtitle">Selecciona y confirma dónde se enviará el token para<br>recuperar la clave.</p>

        <!-- Caja de selección del correo -->
        <div class="selection-box">
            <div class="selection-icon">
                <!-- Ícono de sobre delineado -->
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                    <polyline points="22,6 12,13 2,6"></polyline>
                </svg>
            </div>
            
            <div class="selection-text">
                <span class="selection-label">Correo personal registrado</span>
                <span class="selection-value">{{ email_enmascarado|default:"No disponible" }}</span>
            </div>

            <div class="selection-check">
                <!-- Ícono de círculo con check -->
                <svg viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="11"/>
                    <path d="M7.5 12.5L10.5 15.5L16.5 9.5" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
        </div>

        <!-- Formulario para el botón -->
        <form action="#" method="POST">
            {% csrf_token %}
            <button type="submit" class="btn-submit">
                Enviar Token
                <!-- Ícono de flecha derecha -->
                <svg viewBox="0 0 24 24">
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                    <polyline points="12 5 19 12 12 19"></polyline>
                </svg>
            </button>
        </form>

        <!-- Enlace Cancelar -->
        <a href="{% url 'auth:login' %}" class="cancel-link">Cancelar y volver</a>
    </div>

</body>
</html>
